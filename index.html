<title>Lean Build — Workout Tracker</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1f232c;--line:#2a2f3a;--text:#e8eaf0;--muted:#9aa3b2;--acc:#7cc4ff;--good:#5ad19a;--warn:#f2c14e;--bad:#ff7a7a;--push:#ff9f6e;--pull:#7cc4ff;--legs:#b693ff;--core:#5ad19a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif}
body{padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{font-size:18px;margin:0;letter-spacing:.02em}
.top .ph{color:var(--muted);font-size:13px;text-align:right}
main{max-width:600px;margin:0 auto;padding:12px 14px calc(170px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:12px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.25)}
button.primary{background:var(--acc);color:#071320;border-color:transparent;font-weight:650}
button.danger{background:transparent;color:var(--bad);border-color:#5a2c2c}
button.big{width:100%;padding:16px;font-size:17px;text-align:left;display:block}
button.link{background:none;border:0;padding:4px 0;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.nogrow{flex:0 0 auto!important}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:90px;font-size:13px}
label.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
label.tog input{width:22px;height:22px;flex:0 0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,17,21,.97);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--acc)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:650;font-size:16px}.exja{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.chip{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
.chip.sec{border-style:dashed;opacity:.7}
.target{font-size:13px;color:var(--muted)}
.hint{background:#121722;border-left:3px solid var(--acc);padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0}
details.cue summary{color:var(--acc);font-size:13px;cursor:pointer;padding:2px 0}
details.cue p{font-size:13px;color:#cfd5df}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 52px;gap:8px;align-items:center;margin:6px 0}
.setrow.now{grid-template-columns:26px 1fr 52px}
.setrow.head{font-size:11.5px;color:var(--muted);margin:10px 0 0}
.setrow .sn{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.setrow input{text-align:center}
.setrow button.ck{padding:9px 0}
.setrow.done input{border-color:#2f6b50;background:#0e1b15}
.setrow.done button.ck{background:var(--good);color:#07160f;border-color:transparent;font-weight:700}
.setbtns{display:flex;gap:8px;margin-top:6px}.setbtns button{padding:6px 12px;font-size:13px}
.timer{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:580px;margin:0 auto;background:#1b2130;border:1px solid var(--line);border-radius:14px;padding:10px 12px;z-index:7;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);overflow:hidden}
.timer .t{font-size:24px;font-variant-numeric:tabular-nums;font-weight:700;min-width:62px}
.timer .lbl{flex:1;font-size:12px;color:var(--muted)}
.timer button{padding:7px 10px;font-size:13px}
.timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width .25s linear}
.timer.fin{background:#15342a;border-color:#2f6b50}
.hidden{display:none!important}
.sheet{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;border-top:1px solid var(--line)}
.sheet-body .stack button{display:block;width:100%;margin:0 0 8px;text-align:left}
.pickitem{display:block;width:100%;text-align:left;margin:0 0 6px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));background:#26324a;padding:10px 14px;border-radius:10px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.toast.show{opacity:1}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:13.5px;border:1px solid}
.banner.warn{background:#2a2414;border-color:#5c4b1d;color:#f5dc9a}
.banner.bad{background:#2a1515;border-color:#5a2c2c;color:#ffc2c2}
.banner.info{background:#132033;border-color:#24406a;color:#cfe6ff}
.mbar{display:grid;grid-template-columns:92px 1fr 54px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.mbar .val{text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;height:14px;background:#0b0d11;border-radius:7px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;background:rgba(90,209,154,.13);border-left:1px dashed rgba(90,209,154,.55);border-right:1px dashed rgba(90,209,154,.55)}
.fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0;background:#0b0d11}
.split div{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.seg{display:flex;background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
details.sess{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:10px 12px}
details.sess summary{cursor:pointer;list-style:none}
details.sess summary::-webkit-details-marker{display:none}
.ok{color:var(--good)}.lo{color:var(--warn)}.hi{color:var(--acc)}
ul.tight{margin:6px 0;padding-left:18px}ul.tight li{margin:3px 0}
.phase{display:flex;gap:10px;padding:8px 10px;border-radius:10px;margin:4px 0;border:1px solid transparent}
.phase.cur{border-color:var(--acc);background:#121a26}
.phase b{min-width:86px}
</style>
</head>
<body>
<header class="top"><h1>Lean Build</h1><div class="ph" id="hdrph"></div></header>
<main id="view"></main>

<div id="timer" class="timer hidden">
  <span class="t" id="tt">0:00</span><span class="lbl" id="tl">Rest</span>
  <button data-act="tminus">−15</button><button data-act="tplus">+15</button><button data-act="tskip">Skip</button>
  <div class="bar" id="tb"></div>
</div>

<nav class="tabs">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Today</button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Plan</button>
  <button data-act="tab" data-tab="balance"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 20h14M6 8l-3 6a3 3 0 0 0 6 0zM18 8l-3 6a3 3 0 0 0 6 0zM6 8h12"/></svg>Balance</button>
  <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
  <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>More</button>
</nav>

<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* ================= Data: muscles, machines, program ================= */
const GRPCOL={push:'var(--push)',pull:'var(--pull)',legs:'var(--legs)',core:'var(--core)'};
const GRPNAME={push:'Push',pull:'Pull',legs:'Legs',core:'Core'};
const MUSCLES={
  chest:{n:'Chest',ja:'胸',g:'push',major:true},
  shoulders:{n:'Shoulders',ja:'肩（前・横）',g:'push',major:true},
  triceps:{n:'Triceps',ja:'上腕三頭筋',g:'push',major:true},
  back:{n:'Back',ja:'背中',g:'pull',major:true},
  reardelts:{n:'Rear delts',ja:'肩（後ろ）',g:'pull',major:false},
  biceps:{n:'Biceps',ja:'上腕二頭筋',g:'pull',major:true},
  quads:{n:'Quads',ja:'太もも前',g:'legs',major:true},
  hamstrings:{n:'Hamstrings',ja:'太もも裏',g:'legs',major:true},
  glutes:{n:'Glutes',ja:'お尻',g:'legs',major:true},
  calves:{n:'Calves',ja:'ふくらはぎ',g:'legs',major:false},
  core:{n:'Core',ja:'体幹・腹筋',g:'core',major:true},
  lowerback:{n:'Lower back',ja:'腰',g:'core',major:false}
};
const AREAS={bc:'Back & Chest · 【背中・胸】',cs:'Chest & Shoulders · 【胸・肩】',sa:'Shoulders & Arms · 【肩・腕】',lg:'Legs · 【脚】',la:'Legs & Abs · 【脚・お腹】',fw:'Free weight area · フリーウェイト',bw:'Bodyweight · 自重'};
/* k: weight | assist (lower = harder) | reps (bodyweight) | time (seconds) */
const EX={
  seatedrow:{en:'Seated Row',ja:'シーテッドロー',a:'bc',k:'weight',inc:2.5,p:['back'],s:['biceps','reardelts'],cue:'Sit tall with your chest on the pad. Pull the handles to your lower ribs, squeeze your shoulder blades together, then return slowly.'},
  facepull:{en:'Cable Face Pull',ja:'デュアル・アジャスタブルプーリー（フェイスプル）',a:'bc',k:'weight',inc:2.5,p:['reardelts'],s:['back'],cue:'Rope attachment at face height. Pull toward your forehead with elbows high, pulling the rope ends apart at the end. Light weight, controlled.'},
  pushdown:{en:'Cable Triceps Pushdown',ja:'デュアル・アジャスタブルプーリー（プッシュダウン）',a:'bc',k:'weight',inc:2.5,p:['triceps'],s:[],cue:'Rope or bar on a high pulley. Pin your elbows to your sides and straighten your arms fully. Only your forearms move.'},
  pallof:{en:'Cable Pallof Press',ja:'ハンマーデュアル・アジャスタブル・プーリー（パロフプレス）',a:'bc',k:'weight',inc:2.5,p:['core'],s:[],cue:'Stand side-on to a cable at chest height. Press the handle straight out, hold 2 s, bring it back — don\'t let it twist you. Reps are per side.'},
  backext:{en:'Back Extension',ja:'バックエクステンション',a:'bc',k:'weight',inc:2.5,p:['lowerback'],s:['glutes','hamstrings'],cue:'Hips just over the pad edge. Hinge down slowly, rise until your body is a straight line — don\'t over-arch. Log 0 kg for bodyweight; hold a plate once 15 is easy.'},
  chestpress:{en:'Chest Press',ja:'チェストプレス',a:'bc',k:'weight',inc:2.5,p:['chest'],s:['triceps','shoulders'],cue:'Handles at mid-chest height. Shoulder blades back and down. Press smoothly, take 2–3 s on the way back.'},
  fly:{en:'Chest Fly',ja:'フライ/リアデルトイド（フライ）',a:'cs',k:'weight',inc:2.5,p:['chest'],s:[],cue:'Slight bend in the elbows, bring the handles together in a hugging arc, open slowly until you feel a chest stretch.'},
  reardelt:{en:'Rear Delt Fly',ja:'フライ/リアデルトイド（リア）',a:'cs',k:'weight',inc:2.5,p:['reardelts'],s:['back'],cue:'Face the pad. Arms nearly straight, sweep the handles back and wide. Light weight, no shrugging.'},
  dip:{en:'Assisted Dip',ja:'アシスト・ディップ・チン（ディップ）',a:'cs',k:'assist',inc:5,p:['chest','triceps'],s:['shoulders'],cue:'More assist weight = easier. Lower until upper arms are about parallel to the floor, lean slightly forward, press back up. Log the assist weight.'},
  chin:{en:'Assisted Chin-up',ja:'アシスト・ディップ・チン（チンアップ）',a:'cs',k:'assist',inc:5,p:['back','biceps'],s:[],cue:'Palms facing you. More assist = easier. Start from a full hang, pull your chest toward the bar. Goal over the months: less assist → your first real chin-up.'},
  mj4:{en:'Cable Crossover (MJ4)',ja:'マルチジャングルMJ４',a:'cs',k:'weight',inc:2.5,p:['chest'],s:['shoulders'],cue:'Handles from high or mid pulleys, step forward, bring hands together in front of your chest with a slight elbow bend.'},
  shoulderpress:{en:'Shoulder Press',ja:'ショルダープレス',a:'sa',k:'weight',inc:2.5,p:['shoulders'],s:['triceps'],cue:'Back flat against the pad. Press overhead without arching your lower back; lower to about ear level.'},
  lateral:{en:'Lateral Raise',ja:'ラテラルレイズ',a:'sa',k:'weight',inc:2.5,p:['shoulders'],s:[],cue:'Lead with your elbows and raise to shoulder height. No swinging; 2 s down.'},
  curl:{en:'Biceps Curl',ja:'バイセップスカール',a:'sa',k:'weight',inc:2.5,p:['biceps'],s:[],cue:'Upper arms flat on the pad. Full range — all the way down, all the way up — and lower slowly.'},
  legpress:{en:'Leg Press',ja:'レッグプレス',a:'lg',k:'weight',inc:5,p:['quads'],s:['glutes'],cue:'Feet shoulder-width in the middle of the platform. Lower until knees reach ~90°, push through the whole foot. Don\'t lock your knees at the top.'},
  legcurl:{en:'Lying Leg Curl',ja:'レッグカール（ライイング）',a:'lg',k:'weight',inc:2.5,p:['hamstrings'],s:[],cue:'Keep your hips pressed into the pad. Curl fully, lower over ~3 s.'},
  calf:{en:'Standing Calf Raise',ja:'カーフ（スタンディング）',a:'lg',k:'weight',inc:5,p:['calves'],s:[],cue:'Full stretch at the bottom with a 1 s pause, then rise as high as you can. Slow reps beat bouncing.'},
  hipabd:{en:'Hip Abduction',ja:'ヒップアブダクション',a:'lg',k:'weight',inc:2.5,p:['glutes'],s:[],cue:'Push knees outward against the pads, 1 s squeeze, return slowly. Works the side glutes that keep knees stable.'},
  hipadd:{en:'Hip Adduction',ja:'ヒップアダクション',a:'lg',k:'weight',inc:2.5,p:[],s:['glutes','quads'],cue:'Squeeze knees together against the pads, return slowly. Inner thighs.'},
  legext:{en:'Leg Extension',ja:'レッグエクステンション',a:'la',k:'weight',inc:2.5,p:['quads'],s:[],cue:'Line your knee up with the machine\'s pivot. Extend fully, squeeze 1 s, lower slowly.'},
  legraise:{en:'Hanging Knee / Leg Raise',ja:'レッグレイズ',a:'la',k:'reps',p:['core'],s:[],harder:'straighter legs, slower lowering',cue:'Back against the pad, forearms on the rests. Raise your knees by curling your pelvis up; no swinging. Straighten legs as you get stronger.'},
  abmachine:{en:'Ab Crunch Machine',ja:'アブドミナル',a:'la',k:'weight',inc:2.5,p:['core'],s:[],cue:'Curl your ribs toward your hips — move from the spine, not by pulling with your arms.'},
  torsorot:{en:'Torso Rotation',ja:'トーソローテーション',a:'la',k:'weight',inc:2.5,p:['core'],s:[],cue:'Rotate slowly and under control within a comfortable range. Reps per side.'},
  abbench:{en:'Ab Bench Crunch',ja:'アブドミナルベンチ',a:'la',k:'reps',p:['core'],s:[],harder:'hold a light plate or raise the incline',cue:'Feet hooked, curl up by rounding your upper back, lower slowly.'},
  goblet:{en:'Dumbbell Goblet Squat',ja:'ダンベル・ゴブレットスクワット',a:'fw',k:'weight',inc:2,p:['quads','glutes'],s:['core'],cue:'Hold one dumbbell at your chest. Sit down between your heels, chest up, knees tracking over toes. As deep as you can with a flat back.'},
  rdl:{en:'Dumbbell Romanian Deadlift',ja:'ダンベル・ルーマニアンデッドリフト',a:'fw',k:'weight',inc:2,p:['hamstrings','glutes'],s:['lowerback'],cue:'Soft knees, push your hips back, slide the dumbbells down your thighs to mid-shin. Flat back; feel the hamstrings stretch. kg = per dumbbell.'},
  splitsquat:{en:'Dumbbell Split Squat',ja:'ダンベル・スプリットスクワット',a:'fw',k:'weight',inc:2,p:['quads','glutes'],s:['hamstrings'],cue:'Long stance, dumbbells at your sides. Drop the back knee straight down, front foot flat. Reps are per leg; kg = per dumbbell. Start with bodyweight in week 1.'},
  latpulldown:{en:'Iso-Lateral Lat Pulldown',ja:'アイソラテラル・フロントラット・プルダウン',a:'fw',k:'weight',inc:2.5,p:['back'],s:['biceps'],cue:'Chest up, pull elbows down toward your ribs. Don\'t lean far back or yank. Weight = total plates loaded.'},
  declinepress:{en:'Iso-Lateral Decline Press',ja:'アイソラテラルデクライン・プレス',a:'fw',k:'weight',inc:2.5,p:['chest'],s:['triceps'],cue:'Shoulder blades pinned back, press smoothly, control the return.'},

};
const CARDIO=['Treadmill / トレッドミル','Upright bike / アップライトバイク','Recumbent bike / リカンベントバイク','Cross trainer / クロストレーナー','Power mill / パワーミル','Walk outside / ウォーキング'];
const DEFRANGE={weight:'8–12',assist:'6–10',reps:'5–15',time:'15–40'};

/* ================= Helpers ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fmtDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const parseRange=r=>{const m=String(r).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:[8,12]};
const r1=n=>Math.round(n*10)/10;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const typeName=t=>PLAN[t]?PLAN[t].name:(t==='X'?'Custom':t);
const LB=0.45359237;

/* ================= Storage ================= */
const KEY='leanbuild.v1';
let storageOK=true;
function fresh(){return {v:1,startDate:null,sessions:[],draft:null,bw:[],settings:{sound:true,autoTimer:true,bwUnit:'lb'},meta:{lastBackup:null,persistAsked:false}}}
function migrate(o){const f=fresh();return Object.assign(f,o,{settings:Object.assign(f.settings,o.settings||{}),meta:Object.assign(f.meta,o.meta||{}),sessions:Array.isArray(o.sessions)?o.sessions:[],bw:Array.isArray(o.bw)?o.bw:[]})}
function load(){
  try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t')}catch(e){storageOK=false;return fresh()}
  try{const raw=localStorage.getItem(KEY);if(raw)return migrate(JSON.parse(raw))}catch(e){}
  return fresh();
}
let store=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(store));storageOK=true}catch(e){storageOK=false}
}
let saveT=null;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,250)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(saveT);save()}});
window.addEventListener('pagehide',()=>{clearTimeout(saveT);save()});
function askPersist(){
  if(store.meta.persistAsked)return;store.meta.persistAsked=true;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
}

/* ================= Program logic ================= */
function sorted(){return [...store.sessions].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0))}
function weekOf(ds){if(!store.startDate)return 1;return Math.max(1,Math.floor((dayNum(ds)-dayNum(store.startDate))/7)+1)}
function phaseOf(w){
  if(w%8===0)return {key:'deload',name:'Deload',desc:'Recovery week: half the sets, same weights, same effort. Your body catches up and you come back stronger.'};
  if(w<=2)return {key:'learn',name:'Learn',desc:'2 sets per exercise. Use light–moderate weights and stop with 3–4 reps left in the tank. Goal: learn every machine and movement.'};
  if(w<=7)return {key:'found',name:'Foundation',desc:'Full sets. Stop each set with about 2–3 reps left. Add reps first; when every set hits the top of the range, add weight.'};
  return {key:'build',name:'Build',desc:'+1 set on the first 4 exercises of each gym day. Stop sets with about 1–2 reps left. Keep beating last time.'};
}
function targetSets(base,idx,isBW,ph){
  if(ph.key==='learn')return Math.min(2,base);
  if(ph.key==='deload')return Math.max(1,Math.ceil(base/2));
  if(ph.key==='build'&&!isBW&&idx<4)return base+1;
  return base;
}
function bands(ph){return ph.key==='learn'?{maj:[4,10],min:[2,8]}:ph.key==='build'?{maj:[10,20],min:[4,12]}:{maj:[6,12],min:[3,8]}}
function nextGym(){const s=sorted().find(x=>['A','B','C'].includes(x.type));return s?{A:'B',B:'C',C:'A'}[s.type]:'A'}
function lastEntry(exId){
  for(const s of sorted()){const e=s.entries.find(e=>e.exId===exId&&e.sets.length);if(e)return {date:s.date,entry:e}}
  return null;
}
function fmtSet(ex,s){
  if(ex.k==='weight')return `${s.w}×${s.r}`;
  if(ex.k==='assist')return `${s.r} @${s.w} assist`;
  if(ex.k==='time')return `${s.r}s`;
  return `${s.r}`;
}
function suggest(exId,range){
  const ex=EX[exId],last=lastEntry(exId);
  if(!last){
    const t=ex.k==='weight'?'First time: pick a weight you could lift for 3–4 more reps with clean form. It\'s fine to start light.'
      :ex.k==='assist'?'First time: choose an assist weight that lets you reach the low end of the range with good form.'
      :'First time: find your level. Stop 1–2 reps before form breaks.';
    return {w:'',text:t,last:null};
  }
  const sets=last.entry.sets,hi=range[1];
  const all=sets.length>0&&sets.every(s=>num(s.r)>=hi);
  const ws=sets.map(s=>num(s.w));
  const lastTxt=sets.map(s=>fmtSet(ex,s)).join(', ');
  let w='',text;
  if(ex.k==='weight'){
    w=Math.max(...ws);
    if(all&&w===0){text='Top of range with bodyweight → hold a light plate (2.5–5 kg).'}
    else if(all){w=r1(w+ex.inc);text=`Every set hit ${hi} → go up to ~${w} kg (the next smallest step).`}
    else text=`Same ${w} kg — beat last time by at least 1 rep somewhere.`;
  }else if(ex.k==='assist'){
    w=Math.min(...ws);
    if(all){w=Math.max(0,r1(w-ex.inc));text=`Every set hit ${hi} → less assistance: ~${w} kg.`}
    else text=`Same ${w} kg assist — aim for +1 rep.`;
  }else if(ex.k==='reps'){
    text=all?`Top of range → make it harder (${ex.harder||'slower lowering'}).`:'Beat last time by 1 rep.';
  }else{
    text=all?`Hit ${hi}s → add 5 s or a harder version.`:'Hold a few seconds longer than last time.';
  }
  return {w,text,last:lastTxt,lastDate:last.date};
}
function makeEntry(id,n,rr,rest){
  const range=parseRange(rr),sg=suggest(id,range);
  return {exId:id,range,rest:rest||90,sets:Array.from({length:n},()=>({w:sg.w,r:'',done:false}))};
}
function volume(days){
  const end=dayNum(todayStr()),start=end-days+1,v={};
  Object.keys(MUSCLES).forEach(k=>v[k]=0);
  let gym=0,bw=0,cardio=0,n=0;
  for(const s of store.sessions){
    const dn=dayNum(s.date);if(dn<start||dn>end)continue;
    n++;if(s.type==='BW')bw++;else if(s.entries.length)gym++;
    for(const e of s.entries){const ex=EX[e.exId];if(!ex)continue;const k=e.sets.length;ex.p.forEach(m=>v[m]+=k);ex.s.forEach(m=>v[m]+=k*.5)}
    (s.cardio||[]).forEach(c=>cardio+=num(c.min));
  }
  return {v,gym,bw,cardio,n};
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function openSheet(html){const sh=$('#sheet');sh.innerHTML=`<div class="sheet-bg" data-act="closesheet"></div><div class="sheet-body">${html}</div>`;sh.classList.remove('hidden')}

function viewToday(){
  if(store.draft)return viewDraft();
  const t=todayStr(),wk=weekOf(t),ph=phaseOf(wk),nx=nextGym(),vol=volume(7),p=PLAN[nx];

  h+=`<div class="row" style="margin:10px 0 14px">${['A','B','C'].filter(x=>x!==nx).map(x=>`<button data-act="start" data-t="${x}">${PLAN[x].name}</button>`).join('')}<button data-act="start" data-t="BW">Bodyweight</button><button data-act="start" data-t="X">Custom</button></div>`;
  h+=`<div class="card"><h2>Last 7 days</h2><div class="row small" style="text-align:center"><div><div style="font-size:22px;font-weight:700">${vol.gym}</div><div class="muted">gym<br>(goal 3)</div></div><div><div style="font-size:22px;font-weight:700">${vol.bw}</div><div class="muted">bodyweight<br>(goal 1–2)</div></div><div><div style="font-size:22px;font-weight:700">${Math.round(vol.cardio)}</div><div class="muted">cardio min<br>(goal 60–90)</div></div></div>`;

  h+=`<div class="card small"><h2>Weekly rhythm</h2><div class="muted">Mon <b style="color:var(--text)">A</b> · Tue bodyweight · Wed <b style="color:var(--text)">B</b> · Thu rest / walk · Fri <b style="color:var(--text)">C</b> · Sat bodyweight or cardio · Sun rest</div><p class="muted tiny">Any 3 non-consecutive gym days work. Just keep the A → B → C order.</p></div>`;

}

function viewDraft(){
  const d=store.draft,wk=weekOf(d.date),ph=phaseOf(wk),p=PLAN[d.type];
  let h=`<div class="card"><div class="row" style="align-items:center"><div style="flex:2"><h2 style="margin:0">${typeName(d.type)}</h2><div class="muted tiny">Week ${wk} · ${ph.name}${p&&!p.bw?' · warm up 5 min first':''}</div></div><input type="date" data-draft="date" value="${d.date}" style="flex:1.3"></div>`;
  if(ph.key==='learn')h+=`<p class="tiny muted">Learn phase: sets are trimmed to 2. Light weights, perfect reps.</p>`;
  if(ph.key==='deload')h+=`<p class="tiny muted">Deload week: sets halved. Same weights, no grinding.</p>`;
  h+=`</div>`;
  if(!d.entries.length)h+=`<div class="card small muted">No exercises yet. Tap “+ Add exercise” to log any machine.</div>`;
  d.entries.forEach((e,i)=>h+=entryCard(e,i));
  h+=`<button data-act="addex" style="width:100%;margin-bottom:12px">+ Add exercise</button>`;
  h+=`<div class="card"><h2>Cardio <span class="muted small">(optional)</span></h2>${(d.cardio||[]).map((c,k)=>`<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><select data-cf="m" data-k="${k}" style="flex:2">${CARDIO.map(x=>`<option ${x===c.m?'selected':''}>${x}</option>`).join('')}</select><input inputmode="numeric" data-cf="min" data-k="${k}" value="${esc(c.min)}" placeholder="min" style="flex:.8"><button class="nogrow" data-act="rmcardio" data-k="${k}">✕</button></div>`).join('')}<button data-act="addcardio">+ Add cardio</button></div>`;
  h+=`<div class="row"><button class="danger" data-act="discard">Discard</button><button class="primary" data-act="finish" style="flex:2">Finish workout</button></div>`;
  return h;
}

function entryCard(e,i){
  const ex=EX[e.exId];if(!ex)return '';
  const sg=suggest(e.exId,e.range),showW=ex.k==='weight'||ex.k==='assist';
  const unitW=ex.k==='assist'?'assist kg':'kg',unitR=ex.k==='time'?'seconds':'reps';
  let h=`<section class="card ex"><div class="exhead"><div><div class="exname">${ex.en}</div><div class="exja">${ex.ja}</div></div><button class="nogrow" data-act="exmenu" data-i="${i}" aria-label="Options">⋯</button></div>`;
  h+=`<div class="chips">${chips(ex)}</div>`;
  h+=`<div class="target">Target: ${e.sets.length} × ${e.range[0]}–${e.range[1]} ${unitR} · rest ${e.rest}s</div>`;
  h+=`<div class="hint">${sg.last?`<span class="muted">Last (${fmtDate(sg.lastDate)}):</span> ${esc(sg.last)}<br>`:''}→ ${esc(sg.text)}</div>`;
  h+=`<details class="cue"><summary>How to do it</summary><p>${esc(ex.cue)}</p></details>`;
  h+=`<div class="setrow head ${showW?'':'now'}"><span>#</span>${showW?`<span style="text-align:center">${unitW}</span>`:''}<span style="text-align:center">${unitR}</span><span></span></div>`;
  e.sets.forEach((s,j)=>{
    h+=`<div class="setrow ${s.done?'done':''} ${showW?'':'now'}"><span class="sn">${j+1}</span>`
      +(showW?`<input inputmode="decimal" data-f="w" data-i="${i}" data-s="${j}" value="${esc(s.w)}" placeholder="kg" aria-label="${unitW} set ${j+1}">`:'')
      +`<input inputmode="numeric" pattern="[0-9]*" data-f="r" data-i="${i}" data-s="${j}" value="${esc(s.r)}" placeholder="${e.range[0]}–${e.range[1]}" aria-label="${unitR} set ${j+1}">`
      +`<button class="ck" data-act="done" data-i="${i}" data-s="${j}" aria-label="Set done">✓</button></div>`;
  });
  h+=`<div class="setbtns"><button data-act="addset" data-i="${i}">+ Set</button>${e.sets.length>1?`<button data-act="rmset" data-i="${i}">− Set</button>`:''}</div></section>`;
  return h;
}

function viewPlan(){
  const wk=weekOf(todayStr()),ph=phaseOf(wk);
  let h=`<div class="card"><h2>Your program</h2><p class="small">A <b>lean, balanced, athletic</b> build: 3 full-body gym days and 1–2 short bodyweight sessions each week. Every muscle group is trained 2–3× a week, pulling slightly outweighs pushing, and legs get as much attention as the upper body, so no single part of you outgrows the rest.</p></div>`;
  const phases=[['Weeks 1–2','learn','Learn','2 sets each, light. Learn the movements.'],['Weeks 3–7','found','Foundation','Full sets, 2–3 reps in reserve.'],['Week 8','deload','Deload','Half the sets. Recover.'],['Weeks 9–15','build','Build','+1 set on main lifts, 1–2 reps in reserve.'],['Week 16, 24…','deload','Deload','Every 8th week.']];
  h+=`<div class="card"><h2>Phases</h2>${phases.map(p=>`<div class="phase ${p[1]===ph.key&&(p[1]!=='deload'||(wk===8?p[0]==='Week 8':p[0]!=='Week 8'))?'cur':''}"><b class="small">${p[0]}</b><div class="small"><b>${p[2]}</b> — <span class="muted">${p[3]}</span></div></div>`).join('')}<p class="tiny muted">After week 16 keep cycling Build + Deload. Around month 6, swap a few exercises for variety (e.g. Smith squat for goblet squat, dumbbell bench for chest press).</p></div>`;
  for(const t of ['A','B','C','BW']){
    const p=PLAN[t];
    h+=`<div class="card"><h2>${p.name} <span class="muted small">— ${p.sub}</span></h2><table><tr><th>Exercise</th><th>Sets × reps</th><th>Rest</th></tr>${p.items.map(([id,s,rr,rest],i)=>{const ex=EX[id];return `<tr><td>${ex.en}<div class="tiny muted">${ex.ja}</div></td><td>${targetSets(s,i,!!p.bw,ph)} × ${rr}${ex.k==='time'?' s':''}</td><td class="muted">${rest}s</td></tr>`}).join('')}</table></div>`;
  }
  h+=`<div class="card small"><h2>How hard? (reps in reserve)</h2><p>End each set when you could do only about <b>2–3 more clean reps</b> (1–2 in the Build phase). The last reps should be slow and hard, but your form should never break. Training to total failure isn't needed.</p>
  <h2 style="margin-top:12px">Progression: reps, then weight</h2><p>Each exercise has a rep range (e.g. 8–12). Keep the weight the same and add reps each session. Once <b>every set reaches the top</b>, add the smallest weight step and work back up. The app tells you which one to do.</p>
  <h2 style="margin-top:12px">Rest & warm-up</h2><p>5 min easy cardio, then 1–2 light sets of the first exercise. Rest about 2 min on big lifts and 60–90 s on small ones; the timer starts automatically when you tick a set.</p>
  <h2 style="margin-top:12px">Cardio</h2><p>2–3 × 20–30 min a week at an easy pace where you can still talk (bike, cross trainer, incline treadmill walk). Do it after lifting or on rest days. It helps your heart, recovery and staying lean.</p>
  <h2 style="margin-top:12px">Food & recovery</h2><ul class="tight"><li><b>Protein:</b> 1.6–2.2 g per kg of bodyweight daily (≈100–140 g at 63.5 kg), spread over 3–4 meals.</li><li><b>Calories:</b> a small surplus (~200–300 kcal/day) for lean gains. Track your weekly average weight (More tab) and aim for roughly +0.3–0.8 kg per month. Faster than that usually means more fat.</li><li><b>Sleep:</b> 7–9 h. This is when the muscle actually gets built.</li></ul>
  <h2 style="margin-top:12px">Balance rules</h2><ul class="tight"><li>Pull ≥ push (rows, pulldowns, face pulls ≥ presses) for healthy shoulders and posture.</li><li>Legs every gym day; core 3–5× a week.</li><li>Single-leg and single-side work (split squats, bridges, Pallof) evens out left/right differences.</li><li>Check the <b>Balance</b> tab weekly.</li></ul>
  <p class="tiny muted">General fitness guidance, not medical advice. Stop any movement that causes sharp or joint pain.</p></div>`;
  return h;
}

function viewBalance(){
  const days=balMode,vol=volume(days),div=days===28?4:1,v={};
  for(const k in vol.v)v[k]=vol.v[k]/div;
  const ph=phaseOf(weekOf(todayStr())),bd=bands(ph);
  const g={push:0,pull:0,legs:0,core:0};for(const k in v)g[MUSCLES[k].g]+=v[k];
  const enough=days===7?vol.gym>=2:vol.gym>=6;

  let h=`<div class="seg"><button data-act="balmode" data-m="7" class="${days===7?'on':''}">Last 7 days</button><button data-act="balmode" data-m="28" class="${days===28?'on':''}">4-week average</button></div>`;
  if(!vol.n)return h+`<div class="card small muted">No workouts in this period yet. Once you log sessions, this page shows weekly sets per muscle group and flags anything falling behind.</div>`;
  if(!enough)h+=`<div class="banner info">Log at least ${days===7?'2 gym sessions this week':'6 gym sessions in 4 weeks'} for a fair reading. Bars are shown, but no warnings yet.</div>`;
  if(ph.key==='deload')h+=`<div class="banner info">Deload week: low numbers are expected.</div>`;
  const pp=g.pull>0?g.push/g.pull:(g.push>0?9:1);
  let ppv='<span class="ok">✓ Balanced (pull ≥ push, good for posture)</span>';
  if(pp>1.15)ppv='<span class="lo">↑ Push-heavy: add a pulling set (row, pulldown, face pull)</span>';
  else if(pp>1.0)ppv='<span class="ok">✓ Roughly even</span>';
  else if(pp<0.7)ppv='<span class="hi">Pull-heavy. Fine short-term, but keep the presses in.</span>';
  const up=g.push+g.pull,ls=(up+g.legs)>0?g.legs/(up+g.legs):0;
  let lsv='<span class="ok">✓ Upper and lower in proportion</span>';
  if(ls<.3)lsv='<span class="lo">↓ Legs are falling behind upper body</span>';else if(ls>.58)lsv='<span class="hi">Upper body is light relative to legs</span>';
  const tot=g.push+g.pull||1,tot2=up+g.legs||1;
  h+=`<div class="card"><h2>Push vs pull</h2><div class="split"><div style="width:${g.push/tot*100}%;background:var(--push)"></div><div style="width:${g.pull/tot*100}%;background:var(--pull)"></div></div><div class="legend"><span><i class="dot" style="background:var(--push)"></i>Push ${r1(g.push)} sets</span><span><i class="dot" style="background:var(--pull)"></i>Pull ${r1(g.pull)} sets</span></div><p class="small">${judge?ppv:'<span class="muted">—</span>'}</p>
  <h2 style="margin-top:14px">Upper vs lower</h2><div class="split"><div style="width:${up/tot2*100}%;background:linear-gradient(90deg,var(--push),var(--pull))"></div><div style="width:${g.legs/tot2*100}%;background:var(--legs)"></div></div><div class="legend"><span>Upper ${r1(up)}</span><span><i class="dot" style="background:var(--legs)"></i>Legs ${r1(g.legs)} (${Math.round(ls*100)}%)</span></div><p class="small">${judge?lsv:'<span class="muted">—</span>'}</p></div>`;
  const scale=Math.max(bd.maj[1]*1.15,...Object.values(v));
  const tips=[];
  h+=`<div class="card"><h2>Sets per muscle ${days===28?'(per week)':''}</h2><p class="tiny muted">Green zone = target for the ${ph.name} phase (${bd.maj[0]}–${bd.maj[1]} sets for major groups). Main movers count as 1 set, helpers as ½.</p>`;
  for(const grp of ['push','pull','legs','core']){
    h+=`<h3 style="color:${GRPCOL[grp]}">${GRPNAME[grp]}</h3>`;
    for(const k in MUSCLES){
      const m=MUSCLES[k];if(m.g!==grp)continue;
      const [lo,hi]=m.major?bd.maj:bd.min,val=v[k];
      let st='';
      if(judge){if(val<lo){st=`<span class="lo">↓</span>`;tips.push([k,'lo',lo,hi,val])}else if(val>hi){st=`<span class="hi">↑</span>`;tips.push([k,'hi',lo,hi,val])}else st=`<span class="ok">✓</span>`}
      h+=`<div class="mbar"><span>${m.n}<div class="tiny muted">${m.ja}</div></span><div class="track"><div class="band" style="left:${lo/scale*100}%;width:${(hi-lo)/scale*100}%"></div><div class="fill" style="width:${Math.min(100,val/scale*100)}%;background:${GRPCOL[grp]}"></div></div><span class="val">${r1(val)} ${st}</span></div>`;
    }
  }
  h+=`</div>`;
  if(judge){
    h+=`<div class="card"><h2>What to adjust</h2>`;
    if(!tips.length)h+=`<p class="small ok">Everything is in range. Keep going exactly as you are.</p>`;
    else h+=`<ul class="tight small">`+tips.map(([k,t,lo,hi,val])=>{
      const m=MUSCLES[k];
      if(t==='hi')return `<li><b>${m.n}</b>: ${r1(val)} sets, above ${hi}. Fine if you recover well; don't add more here.</li>`;
      const ex=[...new Set(['A','B','C'].flatMap(d=>PLAN[d].items.map(i=>i[0])).filter(id=>EX[id].p.includes(k)))].slice(0,2).map(id=>EX[id].en);
      return `<li><b>${m.n}</b>: ${r1(val)} sets (target ${lo}–${hi}).${ex.length?` Add a set to ${ex.join(' or ')} next time, or don't skip that day.`:''}</li>`;
    }).join('')+`</ul>`;
    h+=`</div>`;
  }
  h+=`<div class="card small"><div class="row" style="text-align:center"><div><b>${vol.gym}</b><div class="muted tiny">gym sessions</div></div><div><b>${vol.bw}</b><div class="muted tiny">bodyweight</div></div><div><b>${Math.round(vol.cardio/div)}</b><div class="muted tiny">cardio min${days===28?'/wk':''}</div></div></div></div>`;
  return h;
}

function spark(vals){
  if(vals.length<2)return '';
  const w=300,h=50,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(w-10)+5).toFixed(1)},${(h-5-(v-mn)/r*(h-10)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#7cc4ff" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function viewHistory(){
  const ss=sorted();
  if(!ss.length)return `<div class="card small muted">No workouts logged yet. Finished sessions appear here.</div>`;
  const used=[...new Set(ss.flatMap(s=>s.entries.map(e=>e.exId)))].filter(id=>EX[id]);
  if(!histEx||!used.includes(histEx))histEx=used[0];
  const ex=EX[histEx];
  const rows=ss.filter(s=>s.entries.some(e=>e.exId===histEx)).slice(0,12).map(s=>{
    const e=s.entries.find(e=>e.exId===histEx);let best=e.sets[0],metric=-Infinity;
    for(const st of e.sets){
      const m=ex.k==='weight'?num(st.w)*(1+num(st.r)/30)+num(st.r)*.001:ex.k==='assist'?-num(st.w)*100+num(st.r):num(st.r);
      if(m>metric){metric=m;best=st}
    }
    return {date:s.date,best,sets:e.sets.length,metric,e1:ex.k==='weight'&&num(best.w)>0?r1(num(best.w)*(1+num(best.r)/30)):null,reps:e.sets.reduce((a,x)=>a+num(x.r),0)};
  });
  const sv=rows.slice().reverse().map(r=>ex.k==='weight'?(r.e1||r.reps):ex.k==='assist'?r.reps:num(r.best.r));
  let h=`<div class="card"><h2>Exercise progress</h2><select id="histex">${used.map(id=>`<option value="${id}" ${id===histEx?'selected':''}>${EX[id].en}</option>`).join('')}</select>`;
  h+=`<div style="margin:10px 0 2px">${spark(sv)}</div><p class="tiny muted">${ex.k==='weight'?'Line = estimated 1-rep max (rough strength trend).':ex.k==='assist'?'Line = total reps. Also watch the assist number go down.':'Line = best set.'}</p>`;
  h+=`<table><tr><th>Date</th><th>Best set</th><th>Sets</th>${ex.k==='weight'?'<th>Est. 1RM</th>':''}</tr>${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${fmtSet(ex,r.best)}</td><td>${r.sets}</td>${ex.k==='weight'?`<td>${r.e1??'–'}</td>`:''}</tr>`).join('')}</table></div>`;
  h+=`<h3>Sessions</h3>`;
  h+=ss.slice(0,80).map(s=>{
    const n=s.entries.reduce((a,e)=>a+e.sets.length,0);
    return `<details class="sess"><summary><div style="display:flex;justify-content:space-between"><b>${fmtDate(s.date)} · ${typeName(s.type)}</b><span class="muted small">${n} sets${s.dur&&s.dur<240?' · '+s.dur+' min':''}</span></div></summary><div class="small" style="margin-top:8px">${s.entries.map(e=>{const x=EX[e.exId];return x?`<div style="padding:3px 0"><b>${x.en}</b> <span class="muted">${e.sets.map(st=>fmtSet(x,st)).join(', ')}</span></div>`:''}).join('')}${(s.cardio||[]).map(c=>`<div style="padding:3px 0"><b>Cardio</b> <span class="muted">${esc(c.m)} · ${c.min} min</span></div>`).join('')}<div class="row" style="margin-top:8px"><button class="danger nogrow" data-act="delsession" data-id="${s.id}">Delete</button></div></div></details>`;
  }).join('');
  return h;
}

  h+=`<button class="danger" data-act="reset" style="width:100%">Erase all data</button>`;

/* ================= Rest timer ================= */
const timer={end:0,total:0,iv:null,fin:false};
let actx=null;
function unlockAudio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(!store.settings.sound)return;
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if(!actx)return;[0,.25].forEach(off=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+off;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}
}
function startTimer(sec){unlockAudio();timer.total=sec;timer.end=Date.now()+sec*1000;timer.fin=false;$('#timer').classList.remove('hidden','fin');$('#tl').textContent='Rest';if(!timer.iv)timer.iv=setInterval(tick,250);tick()}
function stopTimer(){clearInterval(timer.iv);timer.iv=null;$('#timer').classList.add('hidden')}
function tick(){
  const left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  $('#tt').textContent=Math.floor(left/60)+':'+pad(left%60);
  $('#tb').style.width=(timer.total?(1-left/timer.total)*100:100)+'%';
  if(left===0&&!timer.fin){timer.fin=true;$('#timer').classList.add('fin');$('#tl').textContent='Go — next set';beep();setTimeout(()=>{if(timer.fin)stopTimer()},6000)}
}

/* ================= Actions ================= */
function startSession(type){
  const date=todayStr(),ph=phaseOf(weekOf(date)),p=PLAN[type];
  const entries=p?p.items.map(([id,s,rr,rest],i)=>makeEntry(id,targetSets(s,i,!!p.bw,ph),rr,rest)):[];
  store.draft={id:uid(),type,date,ts:Date.now(),entries,cardio:[]};
  save();render();window.scrollTo(0,0);
}
function finishSession(){
  const d=store.draft;
  const entries=d.entries.map(e=>({exId:e.exId,range:e.range,sets:e.sets.filter(s=>s.done||num(s.r)>0).map(s=>({w:s.w===''?0:num(s.w),r:num(s.r)}))})).filter(e=>e.sets.length);
  const cardio=(d.cardio||[]).filter(c=>num(c.min)>0).map(c=>({m:c.m,min:num(c.min)}));
  if(!entries.length&&!cardio.length){toast('Nothing logged yet. Enter reps on at least one set.');return}
  const n=entries.reduce((a,e)=>a+e.sets.length,0);
  store.sessions.push({id:d.id,type:d.type,date:d.date,ts:d.ts,dur:Math.round((Date.now()-d.ts)/60000),entries,cardio});
  if(!store.startDate||d.date<store.startDate)store.startDate=d.date;
  store.draft=null;askPersist();save();stopTimer();tab='today';render();window.scrollTo(0,0);
  toast(`Saved ✓ ${n} sets${cardio.length?' + cardio':''}. Nice work.`);
}
function openPicker(mode,i){
  pick={mode,i};
  const groups=Object.keys(AREAS).map(a=>`<h3>${AREAS[a]}</h3>`+Object.entries(EX).filter(([,x])=>x.a===a).map(([id,x])=>`<button class="pickitem" data-act="pick" data-id="${id}" data-q="${esc((x.en+' '+x.ja+' '+x.p.concat(x.s).map(m=>MUSCLES[m].n+' '+MUSCLES[m].ja).join(' ')).toLowerCase())}"><b>${x.en}</b> <span class="muted small">${x.ja}</span><div class="chips" style="margin:4px 0 0">${chips(x)}</div></button>`).join('')).join('');
  openSheet(`<div class="row" style="align-items:center;margin-bottom:8px"><h2 style="margin:0">${mode==='swap'?'Swap exercise':'Add exercise'}</h2><button class="nogrow" data-act="closesheet">Close</button></div><input id="pickq" placeholder="Search: row, 胸, glutes…" autocomplete="off">${groups}`);
}
function exportCSV(){
  const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  const rows=[['date','session','exercise','exercise_ja','main_muscles','set','kg','reps_or_seconds']];
  [...store.sessions].sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0)).forEach(s=>{
    s.entries.forEach(e=>{const x=EX[e.exId]||{en:e.exId,ja:'',p:[]};e.sets.forEach((st,j)=>rows.push([s.date,typeName(s.type),x.en,x.ja,x.p.join('+'),j+1,(x.k==='assist'?'-':'')+st.w,st.r]))});
    (s.cardio||[]).forEach(c=>rows.push([s.date,typeName(s.type),'Cardio: '+c.m,'','','', '',c.min+' min']));
  });
  downloadFile(`lean-build-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function downloadFile(name,txt,type){
  try{const url=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true}
  catch(e){toast('Download blocked here. Use Copy instead.');return false}
}
function markBackup(){store.meta.lastBackup=todayStr();save();if(tab==='more')render()}
function backupText(){return JSON.stringify(Object.assign({},store,{exportedAt:new Date().toISOString(),app:'lean-build'}))}
function handleImport(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('That isn\'t a valid backup.');return}
  if(!o||!Array.isArray(o.sessions)){toast('Backup not recognized.');return}
  confirmSheet(`Replace current data (${store.sessions.length} sessions) with this backup (${o.sessions.length} sessions)?`,'Replace',()=>{store=migrate(o);save();tab='today';render();toast('Backup restored ✓')},true);
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=store.draft,i=+b.dataset.i,s=+b.dataset.s;
  switch(a){
    case 'tab':tab=b.dataset.tab;render();window.scrollTo(0,0);break;
    case 'start':
      if(d){toast('Finish or discard the current workout first.');return}
      startSession(b.dataset.t);break;
    case 'done':{
      const st=d.entries[i].sets[s];
      if(!st.done&&!(num(st.r)>0)){toast('Enter reps first');const inp=document.querySelector(`input[data-f="r"][data-i="${i}"][data-s="${s}"]`);inp&&inp.focus();return}
      st.done=!st.done;
      if(st.done){const nx=d.entries[i].sets[s+1];if(nx&&(nx.w===''||nx.w==null))nx.w=st.w;if(store.settings.autoTimer)startTimer(d.entries[i].rest)}
      save();render();break}
    case 'addset':{const e=d.entries[i],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:'',done:false});save();render();break}
    case 'rmset':d.entries[i].sets.pop();save();render();break;
    case 'exmenu':{
      const e=d.entries[i];
      openSheet(`<h2>${EX[e.exId].en}</h2><div class="stack"><button data-act="swap" data-i="${i}">⇄ Swap for another machine</button>${i>0?`<button data-act="mv" data-i="${i}" data-dir="-1">↑ Move up</button>`:''}${i<d.entries.length-1?`<button data-act="mv" data-i="${i}" data-dir="1">↓ Move down</button>`:''}</div><h3>Rest time</h3><div class="row">${[45,60,90,120,180].map(r=>`<button data-act="rest" data-i="${i}" data-r="${r}" class="${e.rest===r?'primary':''}">${r}s</button>`).join('')}</div><div class="stack" style="margin-top:12px"><button class="danger" data-act="rmex" data-i="${i}">Remove exercise</button><button data-act="closesheet">Close</button></div>`);break}
    case 'swap':closeSheet();openPicker('swap',i);break;
    case 'mv':{const j=i+(+b.dataset.dir);[d.entries[i],d.entries[j]]=[d.entries[j],d.entries[i]];save();closeSheet();render();break}
    case 'rest':d.entries[i].rest=+b.dataset.r;save();closeSheet();render();break;
    case 'rmex':d.entries.splice(i,1);save();closeSheet();render();break;
    case 'addex':openPicker('add');break;
    case 'pick':{
      const id=b.dataset.id,ex=EX[id];
      if(pick.mode==='swap'){const old=d.entries[pick.i],same=EX[old.exId].k===ex.k;const ne=makeEntry(id,old.sets.length,same?old.range.join('–'):DEFRANGE[ex.k],old.rest);d.entries[pick.i]=ne}
      else d.entries.push(makeEntry(id,3,DEFRANGE[ex.k],90));
      save();closeSheet();render();
      if(pick.mode==='add')setTimeout(()=>{const cards=document.querySelectorAll('.ex');cards.length&&cards[cards.length-1].scrollIntoView({behavior:'smooth',block:'center'})},50);
      break}
    case 'addcardio':d.cardio=d.cardio||[];d.cardio.push({m:CARDIO[0],min:''});save();render();break;
    case 'rmcardio':d.cardio.splice(+b.dataset.k,1);save();render();break;
    case 'finish':finishSession();break;
    case 'discard':confirmSheet('Discard this workout? Nothing from it will be saved.','Discard',()=>{store.draft=null;save();stopTimer();render()},true);break;
    case 'closesheet':closeSheet();break;
    case 'confirmok':{const fn=pendingConfirm;closeSheet();fn&&fn();break}
    case 'delsession':confirmSheet('Delete this session permanently?','Delete',()=>{store.sessions=store.sessions.filter(x=>x.id!==b.dataset.id);save();render()},true);break;
    case 'tminus':timer.end-=15000;if(timer.end<Date.now())timer.end=Date.now();tick();break;
    case 'tplus':timer.end=Math.max(timer.end,Date.now())+15000;timer.total+=15;timer.fin=false;$('#timer').classList.remove('fin');$('#tl').textContent='Rest';tick();break;
    case 'tskip':stopTimer();break;
    case 'balmode':balMode=+b.dataset.m;render();break;
    case 'bwsave':{
      let v=num($('#bwin').value);if(store.settings.bwUnit==='lb')v=v*LB;
      if(!(v>25&&v<300)){toast('Enter a valid weight');return}
      const t=todayStr();store.bw=store.bw.filter(x=>x.date!==t);store.bw.push({date:t,kg:Math.round(v*100)/100});save();render();toast('Weight saved');break}
    case 'bwdel':store.bw=store.bw.filter(x=>x.date!==b.dataset.d);save();render();break;
    case 'export':if(downloadFile(`lean-build-backup-${todayStr()}.json`,backupText(),'application/json'))markBackup();break;
    case 'share':{
      try{await navigator.share({files:[new File([backupText()],`lean-build-backup-${todayStr()}.json`,{type:'application/json'})],title:'Lean Build backup'});markBackup();toast('Backup saved ✓')}
      catch(e){if(e&&e.name!=='AbortError')toast('Sharing failed. Try Download or Copy.')}
      break}
    case 'copy':
      try{await navigator.clipboard.writeText(backupText());markBackup();toast('Backup copied. Paste it into Notes or a message to yourself.')}
      catch(e){openSheet(`<h2>Copy this text</h2><p class="small muted">Select all and copy, then keep it in Notes or similar.</p><textarea readonly style="min-height:200px">${esc(backupText())}</textarea><button data-act="closesheet" style="width:100%;margin-top:8px">Done</button>`);markBackup()}
      break;
    case 'csv':exportCSV();break;
    case 'importpaste':handleImport($('#pastein').value);break;
    case 'reset':confirmSheet('Erase ALL workouts, weights and settings on this device? This can\'t be undone (unless you have a backup).','Erase everything',()=>{store=fresh();save();stopTimer();tab='today';render()},true);break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target,d=store.draft;
  if(t.dataset.f&&d){d.entries[+t.dataset.i].sets[+t.dataset.s][t.dataset.f]=t.value.replace(',','.');saveSoon();return}
  if(t.dataset.cf&&d){d.cardio[+t.dataset.k][t.dataset.cf]=t.value;saveSoon();return}
  if(t.id==='pickq'){const q=t.value.toLowerCase().trim();document.querySelectorAll('.pickitem').forEach(b=>b.style.display=!q||b.dataset.q.includes(q)?'':'none')}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.cf&&store.draft){store.draft.cardio[+t.dataset.k][t.dataset.cf]=t.value;save();return}
  if(t.dataset.draft==='date'&&store.draft){if(t.value){store.draft.date=t.value;save();render()}return}
  if(t.id==='histex'){histEx=t.value;render();return}
  if(t.dataset.set){
    const k=t.dataset.set;
    if(t.type==='checkbox')store.settings[k]=t.checked;
    else if(k==='startDate'){if(t.value)store.startDate=t.value}
    else store.settings[k]=t.value;
    save();render();return;
  }
  if(t.id==='importfile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.readAsText(t.files[0]);t.value=''}
});

/* ================= Offline support (when hosted with sw.js) ================= */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(()=>{try{caches.open('leanbuild-v1').then(c=>c.add(location.href.split('#')[0])).catch(()=>{})}catch(e){}}).catch(()=>{});
}

render();
</script>
</body>
</html>
